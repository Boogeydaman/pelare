name: Bygg Android-app (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - name: Signera och bygg
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pelare.p12"
            export KEYSTORE_FILE="$RUNNER_TEMP/pelare.p12"
          fi
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          ls app/build/outputs/apk/release/
      - name: Publicera på en fast länk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Appen byggdes men kunde inte signeras: signeringsnyckeln saknas. Kör scripts/skapa-signeringsnyckel.sh en gång."; exit 1
          fi
          cp "$APK" pelare.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Pelare för Android" --notes "Ladda ner pelare.apk och öppna den på telefonen. Nya versioner installeras ovanpå den gamla och din data ligger kvar."
          gh release upload apk pelare.apk --clobber
