name: Bygg Android-app (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - name: Finns signeringsnyckeln?
        env:
          HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Signeringsnyckeln saknas. Kör scripts/skapa-signeringsnyckel.sh en gång."; exit 1
          fi
      - name: Signera och bygg
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pelare.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/pelare.p12"
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/pelare.apk"
      - name: Publicera på en fast länk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Pelare för Android" --notes "Ladda ner pelare.apk och öppna den på telefonen. Nya versioner installeras ovanpå den gamla och din data ligger kvar."
          gh release upload apk pelare.apk --clobber
